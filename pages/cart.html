<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>校園外送｜購物車</title>
    <link rel="stylesheet" href="../css/base.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../index.html">校園外送</a>
      <nav aria-label="主要導覽"><a href="menu.html">菜單</a><a href="order-status.html">訂單狀態</a><a href="../index.html">首頁</a></nav>
    </header>
    <main class="container">
      <section class="page-heading"><p class="eyebrow">訂單確認</p><h1>購物車</h1><p class="muted">這是前台原型，不會真的送出訂單。</p></section>
      <section class="panel">
        <ul id="cart-items" class="cart-list"></ul>
        <div class="cart-summary">
          <dl>
            <dt>小計</dt>
            <dd id="subtotal">NT$0</dd>
            <dt>運費</dt>
            <dd id="shipping">NT$0</dd>
            <dt>總金額</dt>
            <dd id="total">NT$0</dd>
          </dl>
          <button id="simulate-order" class="button">模擬下單</button>
          <p id="cart-status" class="status-message" aria-live="polite"></p>
        </div>
      </section>
    </main>
    <footer>校園外送小組協作練習</footer><script src="../js/app.js"></script>
  </body>
</html>
