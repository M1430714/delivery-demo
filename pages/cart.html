<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>校園外送｜購物車</title>
    <link rel="stylesheet" href="../css/base.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../index.html">校園外送</a>
      <nav aria-label="主要導覽">
        <a href="menu.html">菜單</a>
        <a href="order-status.html">訂單狀態</a>
        <a href="profile.html">會員中心</a>
        <a href="../index.html">首頁</a>
      </nav>
    </header>
    <main class="container">
      <section class="page-heading"><p class="eyebrow">訂單確認</p><h1>購物車</h1><p class="muted">這是前台原型，不會真的送出訂單。</p></section>
      <section class="panel cart-summary" aria-labelledby="cart-heading">
        <h2 id="cart-heading">購物車摘要 — 披薩店</h2>
        <p class="muted">以下為範例品項（此為模擬頁面，不會實際付款）。</p>

        <ul class="cart-items" id="cart-items">
          <!-- JS 會在此渲染至少兩項餐點 -->
        </ul>

        <div class="cart-totals" aria-live="polite">
          <div class="totals-row"><span>小計</span><span id="subtotal">NT$0</span></div>
          <div class="totals-row"><span>運費</span><span id="shipping">NT$0</span></div>
          <div class="totals-row total"><span>總金額</span><span id="total">NT$0</span></div>
        </div>

        <div class="actions">
          <button id="simulate-order" class="button">模擬下單</button>
          <p class="status-message" data-status-message id="cart-status"></p>
        </div>
      </section>
    </main>
    <footer>校園外送小組協作練習</footer><script src="../js/app.js"></script>
  </body>
</html>
